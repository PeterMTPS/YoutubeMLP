<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTubeMLP</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="hero">
        <p class="eyebrow">YouTubeMLP</p>
        <h1>Pinkie Pie Tema</h1>
        <p class="status" id="status" aria-live="polite">Tema ativo</p>
      </header>

      <section class="panel" aria-label="Configurações">
        <label class="row toggle row-main">
          <span class="row-text">
            <span class="row-title">Ativar tema</span>
            <span class="row-hint">Liga ou desliga tudo</span>
          </span>
          <input id="ponytubeEnabled" type="checkbox" role="switch">
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        </label>

        <div class="group" id="options">
          <label class="row toggle">
            <span class="row-text">
              <span class="row-title">Papel de parede</span>
              <span class="row-hint">Imagem da Pinkie no fundo</span>
            </span>
            <input id="ponytubeWallpaper" type="checkbox" role="switch">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </label>

          <div class="row slider-row" id="opacityRow">
            <label class="row-text" for="ponytubeWallpaperOpacity">
              <span class="row-title">Intensidade do fundo</span>
              <span class="row-hint" id="opacityValue">100%</span>
            </label>
            <input id="ponytubeWallpaperOpacity" type="range" min="20" max="100" step="5">
          </div>

          <label class="row toggle">
            <span class="row-text">
              <span class="row-title">Modo leve</span>
              <span class="row-hint">Sem desfoque nem brilhos — mais rápido</span>
            </span>
            <input id="ponytubeLite" type="checkbox" role="switch">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </label>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
